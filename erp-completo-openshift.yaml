apiVersion: v1
kind: Secret
metadata:
  name: erp-db-secret
type: Opaque
stringData:
  POSTGRESQL_USER: "erp_admin"
  POSTGRESQL_PASSWORD: "ErpGlobal2026SecurePassword"
  POSTGRESQL_DATABASE: "erp_global"
  DATABASE_URL: "postgresql://erp_admin:ErpGlobal2026SecurePassword@erp-postgres:5432/erp_global"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: erp-frontend-config
data:
  env-config.js: |
    window._env_ = {
      REACT_APP_RHSSO_URL: "https://empresa-global.com",
      REACT_APP_RHSSO_REALM: "erp-international",
      REACT_APP_RHSSO_CLIENT_ID: "erp-react-web",
      REACT_APP_3SCALE_API_URL: "/api/v1"
    };
---
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: erp-frontend
---
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: erp-backend
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: erp-frontend-build
  labels:
    app: erp-frontend
spec:
  output:
    to:
      kind: ImageStreamTag
      name: erp-frontend:latest
  source:
    type: Git
    git:
      uri: "steven16029"
      ref: "main"
    contextDir: "frontend"
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Containerfile
      env:
        - name: NPM_CONFIG_CACHE
          value: "/tmp/.npm"
        - name: CI
          value: "false"
  triggers:
    - type: ConfigChange
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: erp-backend-build
  labels:
    app: erp-backend
spec:
  output:
    to:
      kind: ImageStreamTag
      name: erp-backend:latest
  source:
    type: Git
    git:
      uri: "steven16029"
      ref: "main"
    contextDir: "backend"
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Containerfile
      env:
        - name: NPM_CONFIG_CACHE
          value: "/tmp/.npm"
  triggers:
    - type: ConfigChange
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: erp-backend
  labels:
    app: erp-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: erp-backend
  template:
    metadata:
      labels:
        app: erp-backend
    spec:
      containers:
        - name: backend
          image: erp-backend:latest
          ports:
            - containerPort: 8080
              protocol: TCP
          env:
            - name: PORT
              value: "8080"
          envFrom:
            - secretRef:
                name: erp-db-secret
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: erp-backend
spec:
  selector:
    app: erp-backend
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: erp-frontend
  labels:
    app: erp-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: erp-frontend
  template:
    metadata:
      labels:
        app: erp-frontend
    spec:
      containers:
        - name: frontend
          image: erp-frontend:latest
          ports:
            - containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          volumeMounts:
            - name: config-volume
              mountPath: /usr/share/nginx/html/env-config.js
              subPath: env-config.js
      volumes:
        - name: config-volume
          configMap:
            name: erp-frontend-config
---
apiVersion: v1
kind: Service
metadata:
  name: erp-frontend
spec:
  selector:
    app: erp-frontend
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: erp-web
  labels:
    app: erp-frontend
spec:
  to:
    kind: Service
    name: erp-frontend
    weight: 100
  port:
    targetPort: 8080
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
