# nginx para OpenShift: UID aleatorio, sin root, logs a stdout/stderr y temporales en /tmp
worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /dev/stdout;
    sendfile      on;
    server_tokens off;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml;

    server {
        listen 8080 default_server;
        server_name _;
        root  /opt/app-root/src;
        index index.html;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Probes de OpenShift
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 'ok';
        }

        # CONEXIÓN FRONTEND -> BACKEND (dentro del clúster, sin CORS ni URLs fijas)
        location /api/ {
            proxy_pass http://erp-backend-svc:8080;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_connect_timeout 5s;
            proxy_read_timeout    30s;
        }

        # La configuración de runtime (ConfigMap) nunca debe quedar en caché
        location = /env-config.js {
            add_header Cache-Control "no-store";
        }

        # Los bundles de CRA llevan hash en el nombre: caché larga
        location /static/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
