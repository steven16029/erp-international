# Credenciales de PostgreSQL (los nombres de las claves son los que espera la imagen rhel9/postgresql-16).
# IMPORTANTE: cambia la contraseña. scripts/deploy.sh genera una aleatoria si el Secret no existe.
apiVersion: v1
kind: Secret
metadata:
  name: erp-db-secret
  labels:
    app.kubernetes.io/part-of: erp-global
type: Opaque
stringData:
  POSTGRESQL_DATABASE: erpdb
  POSTGRESQL_USER: erpadmin
  POSTGRESQL_PASSWORD: CambiaEstaClave2026
